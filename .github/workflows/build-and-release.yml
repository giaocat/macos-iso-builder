name: Build macOS ISO and Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的版本 Tag 时触发

jobs:
  build-and-release:
    runs-on: macos-latest

    permissions:
      contents: write # 给 GITHUB_TOKEN 写入 Release 的权限

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 调用 giaocat/macos-iso-builder 构建 ISO/DMG 镜像
      - name: Build Full Installer ISO/DMG image
        uses: giaocat/macos-iso-builder@edc6b03
        with:
          # 根据该 Action 的说明传入参数（如 macOS 版本）
          mac-version: 'latest' 

      # 3. 下载/获取构建好的 ISO/DMG 产物并发布到 Release
      - name: Create GitHub Release and Upload Image
        uses: softprops/action-gh-release@v2
        with:
          # 匹配生成的 ISO 或 DMG 文件路径
          files: |
            *.iso
            *.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
